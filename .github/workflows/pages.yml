name: Deploy to GitHub Pages

# Pubblica su GitHub Pages sincronizzando il branch gh-pages,
# da cui Pages serve il sito (Settings -> Pages -> Deploy from branch).

on:
  push:
    branches:
      - main
      - "claude/location-map-app-1a1ghw"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push -f origin gh-pages
